<!-- Preview only (remove for launch: PREVIEW=0 bash tools/build.sh v7) -->
<details class="pv" id="pv">
  <summary lang="zh-Hans">预览设置</summary>
  <div class="pv-body" lang="zh-Hans">
    <p class="pv-h" id="pv-theme-h">配色</p>
    <div class="pv-opts" role="radiogroup" aria-labelledby="pv-theme-h">
      <button type="button" role="radio" data-set-theme="noir"><i style="background:#1b1a18"></i><i style="background:#c8a46a"></i>象牙 · 黑金（推荐）</button>
      <button type="button" role="radio" data-set-theme="stone"><i style="background:#4a3a2e"></i><i style="background:#ebe4da"></i>石灰 · 咖啡</button>
      <button type="button" role="radio" data-set-theme="navy"><i style="background:#1f3a5f"></i><i style="background:#c8a46a"></i>象牙 · 藏青金</button>
      <button type="button" role="radio" data-set-theme="sage"><i style="background:#2e6a50"></i><i style="background:#e5efe8"></i>鼠尾草绿</button>
      <button type="button" role="radio" data-set-theme="clay"><i style="background:#8e4b3d"></i><i style="background:#f5e9e4"></i>奶油 · 暖陶</button>
      <button type="button" role="radio" data-set-theme="teal"><i style="background:#0b6477"></i><i style="background:#e3f1f4"></i>清透蓝绿</button>
      <button type="button" role="radio" data-set-theme="sky"><i style="background:#0a5cad"></i><i style="background:#e6f0fb"></i>明亮天蓝</button>
    </div>
    <p class="pv-h" id="pv-hero-h">首页右侧效果</p>
    <div class="pv-opts" role="radiogroup" aria-labelledby="pv-hero-h">
      <button type="button" role="radio" data-set-hero="show">四项服务轮播（推荐）</button>
      <button type="button" role="radio" data-set-hero="lab">化验结果卡片</button>
      <button type="button" role="radio" data-set-hero="curve">细线曲线图</button>
      <button type="button" role="radio" data-set-hero="aurora">只有流光渐变</button>
      <button type="button" role="radio" data-set-hero="particles">3D 粒子球（原版）</button>
      <button type="button" role="radio" data-set-hero="photo">照片版（无特效）</button>
    </div>
    <p class="pv-note">只在预览时出现，上线前会移除。选择会记在这个浏览器里。</p>
  </div>
</details>
